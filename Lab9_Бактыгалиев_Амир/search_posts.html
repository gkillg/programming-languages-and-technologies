<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Поиск публикаций — Fetch API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; font-size: 20px; text-align: center; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 16px; }
    .search-box { margin-bottom: 14px; }
    input[type="text"] { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .items-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
    .item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-size: 13px; }
    .item strong { color: #38bdf8; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Поиск публикаций REST API</h2>
    <p class="sub">Лабораторная работа №9 (Вариант 8) · Клиентский поиск</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск по заголовку...">
    </div>
    <div id="status" style="font-size:12px; color:#94a3b8; margin-bottom:10px;">Загрузка базы постов...</div>
    <ul class="items-list" id="postsList"></ul>
  </div>

  <script>
    let allPosts = [];
    const searchInput = document.getElementById('searchInput');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('postsList');

    async function init() {
      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/posts');
        if (!res.ok) throw new Error('Ошибка ' + res.status);
        allPosts = await res.json();
        statusEl.textContent = 'Загружено ' + allPosts.length + ' публикаций. Введите текст для фильтрации.';
        render(allPosts);
      } catch (err) {
        statusEl.textContent = 'Ошибка загрузки: ' + err.message;
      }
    }

    function render(posts) {
      listEl.innerHTML = posts.slice(0, 15).map(p => `
        <li class="item">
          <strong>#${p.id} ${p.title}</strong>
          <span style="color:#94a3b8;">${p.body}</span>
        </li>
      `).join('');
    }

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = allPosts.filter(p => p.title.toLowerCase().includes(q));
      statusEl.textContent = 'Найдено: ' + filtered.length + ' совпадений';
      render(filtered);
    });

    init();
  </script>
</body>
</html>
