<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список покупок — Web Storage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; font-size: 20px; text-align: center; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 18px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 14px; }
    input[type="text"] { flex: 1; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button.btn-primary { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button.btn-primary:hover { background: #0369a1; }
    .items-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; margin-bottom: 16px; }
    .item-row { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
    .item-row.done span { text-decoration: line-through; color: #64748b; }
    .item-name { font-size: 14px; flex: 1; margin-left: 10px; cursor: pointer; }
    .btn-del { background: transparent; border: none; color: #f87171; font-size: 18px; cursor: pointer; padding: 0 6px; }
    .btn-del:hover { color: #ef4444; }
    .footer-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 14px; font-size: 12px; }
    .badge { background: #334155; padding: 4px 8px; border-radius: 6px; color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🛒 Список покупок</h2>
    <p class="sub">Лабораторная работа №8 (Вариант 1) · Хранилище: localStorage</p>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="Название товара (например, Молоко)">
      <button class="btn-primary" id="addBtn">Добавить</button>
    </div>

    <ul class="items-list" id="itemsList"></ul>

    <div class="footer-actions">
      <span class="badge" id="countBadge">Всего: 0</span>
      <div style="display: flex; gap: 8px;">
        <button id="exportBtn" style="background:#334155; color:#cbd5e1; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">JSON Экспорт</button>
        <button id="clearBtn" style="background:#7f1d1d; color:#fca5a5; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">Очистить все</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'lab8_shopping_items';
    let items = [];

    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(items)) items = [];
    } catch (e) {
      console.error('Ошибка десериализации JSON:', e);
      items = [];
    }

    const listEl = document.getElementById('itemsList');
    const inputEl = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const countBadge = document.getElementById('countBadge');
    const clearBtn = document.getElementById('clearBtn');
    const exportBtn = document.getElementById('exportBtn');

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      render();
    }

    function render() {
      listEl.innerHTML = '';
      countBadge.textContent = 'Всего: ' + items.length;

      if (items.length === 0) {
        listEl.innerHTML = '<li style="text-align:center; color:#64748b; padding:16px;">Список пуст</li>';
        return;
      }

      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'item-row' + (item.bought ? ' done' : '');

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = item.bought;
        chk.addEventListener('change', () => {
          item.bought = chk.checked;
          saveAndRender();
        });

        const span = document.createElement('span');
        span.className = 'item-name';
        span.textContent = item.text;
        span.addEventListener('click', () => {
          item.bought = !item.bought;
          saveAndRender();
        });

        const del = document.createElement('button');
        del.className = 'btn-del';
        del.innerHTML = '&times;';
        del.title = 'Удалить';
        del.addEventListener('click', () => {
          items.splice(index, 1);
          saveAndRender();
        });

        li.appendChild(chk);
        li.appendChild(span);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    function addItem() {
      const val = inputEl.value.trim();
      if (!val) return;
      items.push({ text: val, bought: false, date: new Date().toISOString() });
      inputEl.value = '';
      saveAndRender();
    }

    addBtn.addEventListener('click', addItem);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

    clearBtn.addEventListener('click', () => {
      if (confirm('Очистить весь список покупок?')) {
        items = [];
        saveAndRender();
      }
    });

    exportBtn.addEventListener('click', () => {
      const json = JSON.stringify(items, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'shopping_list.json';
      a.click();
    });

    render();
  </script>
</body>
</html>
