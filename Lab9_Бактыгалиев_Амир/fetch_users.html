<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пользователи — Fetch API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 100%; max-width: 640px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; font-size: 20px; text-align: center; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 16px; }
    .users-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 420px; overflow-y: auto; margin-top: 14px; }
    .user-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .user-name { font-weight: bold; color: #38bdf8; font-size: 14px; }
    .user-meta { font-size: 12px; color: #cbd5e1; margin-top: 4px; line-height: 1.4; }
    button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="card">
    <h2>👥 Пользователи (/users API)</h2>
    <p class="sub">Лабораторная работа №9 (Вариант 2) · Загрузка пользователей</p>
    <button id="loadBtn">Получить список пользователей</button>
    <div id="status" style="text-align:center; font-size:13px; margin-top:12px; color:#94a3b8;">Ожидание запроса</div>
    <div class="users-grid" id="usersGrid"></div>
  </div>

  <script>
    const btn = document.getElementById('loadBtn');
    const statusEl = document.getElementById('status');
    const gridEl = document.getElementById('usersGrid');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      statusEl.textContent = 'Загрузка данных пользователей...';
      gridEl.innerHTML = '';
      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!res.ok) throw new Error('Ошибка ' + res.status);
        const users = await res.json();
        statusEl.textContent = 'Успешно загружено: ' + users.length + ' пользователей';
        gridEl.innerHTML = users.map(u => `
          <div class="user-card">
            <div class="user-name">${u.name} (@${u.username})</div>
            <div class="user-meta">
              📧 ${u.email}<br>
              🏢 ${u.company?.name || 'Нет компании'}<br>
              📍 ${u.address?.city || ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        statusEl.textContent = 'Ошибка загрузки: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
