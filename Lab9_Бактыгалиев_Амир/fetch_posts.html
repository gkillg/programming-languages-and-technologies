<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Публикации — Fetch API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; font-size: 20px; text-align: center; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 16px; }
    .controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
    button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { text-align: center; font-size: 13px; min-height: 20px; margin-bottom: 12px; }
    .status-msg.loading { color: #38bdf8; }
    .status-msg.error { color: #f87171; }
    .status-msg.success { color: #4ade80; }
    .posts-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
    .post-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .post-id { font-size: 11px; color: #38bdf8; font-weight: bold; }
    .post-title { font-size: 14px; font-weight: 600; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📰 Публикации (Fetch API /posts)</h2>
    <p class="sub">Лабораторная работа №9 (Вариант 1) · REST API JSONPlaceholder</p>

    <div class="controls">
      <button id="loadBtn">Загрузить 10 публикаций</button>
    </div>

    <div class="status-msg" id="statusMsg">Нажмите кнопку для загрузки данных</div>
    <ul class="posts-list" id="postsList"></ul>
  </div>

  <script>
    const loadBtn = document.getElementById('loadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const postsList = document.getElementById('postsList');

    async function fetchPosts() {
      loadBtn.disabled = true;
      statusMsg.className = 'status-msg loading';
      statusMsg.textContent = '⏳ Выполняется асинхронный сетевой запрос...';
      postsList.innerHTML = '';

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=10');
        if (!response.ok) {
          throw new Error('HTTP ошибка: статус ' + response.status);
        }
        const data = await response.json();
        
        statusMsg.className = 'status-msg success';
        statusMsg.textContent = '✓ Успешно получено публикаций: ' + data.length;

        data.forEach(post => {
          const li = document.createElement('li');
          li.className = 'post-item';
          
          const idSpan = document.createElement('div');
          idSpan.className = 'post-id';
          idSpan.textContent = 'POST #' + post.id;

          const titleEl = document.createElement('div');
          titleEl.className = 'post-title';
          titleEl.textContent = post.title;

          li.appendChild(idSpan);
          li.appendChild(titleEl);
          postsList.appendChild(li);
        });
      } catch (err) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Ошибка: ' + err.message + ' (проверьте подключение к сети)';
      } finally {
        loadBtn.disabled = false;
      }
    }

    loadBtn.addEventListener('click', fetchPosts);
  </script>
</body>
</html>
