<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лаб 11 Вариант 1 — LikeButton (React)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .container { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 28px; width: 100%; max-width: 580px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; font-size: 20px; text-align: center; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 20px; }
    .like-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 14px; transition: transform 0.15s, border-color 0.2s; }
    .like-card:hover { border-color: #38bdf8; }
    .like-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .like-label { font-size: 15px; font-weight: 600; color: #f1f5f9; }
    .like-badge { background: #e11d48; color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .btn-group { display: flex; gap: 8px; }
    button { padding: 9px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn-like { background: #0284c7; color: white; flex: 2; }
    .btn-like:hover { background: #0369a1; }
    .btn-reset { background: #334155; color: #cbd5e1; flex: 1; }
    .btn-reset:hover { background: #475569; }
    .info-footer { margin-top: 18px; padding-top: 14px; border-top: 1px solid #334155; font-size: 12px; color: #64748b; line-height: 1.5; }
    .creative-box { background: #131f37; border: 1px dashed #0284c7; border-radius: 10px; padding: 12px; margin-top: 14px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Дочерний компонент LikeButton (получает label через props, хранит likes в state)
    function LikeButton({ label, initialLikes = 0, onLikeChanged }) {
      const [likes, setLikes] = useState(initialLikes);

      const handleLike = () => {
        const next = likes + 1;
        setLikes(next);
        if (onLikeChanged) onLikeChanged(label, next);
      };

      const handleReset = () => {
        setLikes(0);
        if (onLikeChanged) onLikeChanged(label, 0);
      };

      return (
        <div className="like-card">
          <div className="like-header">
            <span className="like-label">{label}</span>
            <span className="like-badge">❤️ {likes}</span>
          </div>
          <div className="btn-group">
            <button onClick={handleLike} className="btn-like">
              👍 Поставить лайк (+1)
            </button>
            <button onClick={handleReset} className="btn-reset">
              Сброс (0)
            </button>
          </div>
        </div>
      );
    }

    // Родительский компонент App
    function App() {
      const [totalActions, setTotalActions] = useState(0);

      const trackAction = () => {
        setTotalActions(c => c + 1);
      };

      return (
        <div className="container">
          <h2>👍 Счетчик лайков: LikeButton</h2>
          <p className="subtitle">Лабораторная работа №11 (Вариант 1) · React Functional Components</p>

          <LikeButton
            label="Статья: Архитектура React и Virtual DOM"
            initialLikes={4}
            onLikeChanged={trackAction}
          />

          <LikeButton
            label="Гайд: Управление состоянием через useState"
            initialLikes={18}
            onLikeChanged={trackAction}
          />

          <LikeButton
            label="Практика: Разделение компонентов и props"
            initialLikes={9}
            onLikeChanged={trackAction}
          />

          <div className="creative-box">
            <strong style={{color: '#38bdf8'}}>✨ Творческое дополнение:</strong> Счетчик интерактивных действий в родителе: <strong>{totalActions}</strong>.
            <br />
            Экземпляры LikeButton полностью изолированы и хранят собственные независимые значения.
          </div>

          <div className="info-footer">
            ✓ Использовано 2 собственных компонента (App, LikeButton)<br />
            ✓ Передача подписи и начального числа через props<br />
            ✓ Реактивное обновление интерфейса через useState
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
