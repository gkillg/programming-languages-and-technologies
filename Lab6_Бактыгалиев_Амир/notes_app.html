<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Менеджер заметок и задач</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 30px 16px; display: flex; justify-content: center; }
    .container { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 100%; max-width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; font-size: 20px; margin-bottom: 6px; text-align: center; }
    p.sub { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    .input-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button.add-btn { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button.add-btn:hover { background: #0369a1; }
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; justify-content: center; }
    .filter-btn { background: #334155; color: #cbd5e1; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .filter-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
    ul.notes-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; }
    li.note-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
    li.note-item.completed span { text-decoration: line-through; color: #64748b; }
    .note-text { font-size: 14px; cursor: pointer; flex: 1; margin-left: 10px; }
    .del-btn { background: transparent; border: none; color: #f87171; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 4px; }
    .del-btn:hover { background: rgba(248,113,113,0.1); }
    .empty-state { text-align: center; color: #64748b; font-size: 13px; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📝 Менеджер задач и заметок</h2>
    <p class="sub">С автосохранением в памяти браузера (LocalStorage)</p>

    <div class="input-box">
      <input type="text" id="noteInput" placeholder="Что необходимо сделать?">
      <button class="add-btn" id="addBtn">Добавить</button>
    </div>

    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">В процессе</button>
      <button class="filter-btn" data-filter="completed">Выполненные</button>
    </div>

    <ul class="notes-list" id="notesList"></ul>
    <div class="empty-state" id="emptyState">Список пока пуст</div>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('student_notes') || '[]');
    let currentFilter = 'all';

    const list = document.getElementById('notesList');
    const input = document.getElementById('noteInput');
    const addBtn = document.getElementById('addBtn');
    const emptyState = document.getElementById('emptyState');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function save() {
      localStorage.setItem('student_notes', JSON.stringify(notes));
      render();
    }

    function render() {
      list.innerHTML = '';
      const filtered = notes.filter(n => {
        if (currentFilter === 'active') return !n.completed;
        if (currentFilter === 'completed') return n.completed;
        return true;
      });

      emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

      filtered.forEach((note) => {
        const li = document.createElement('li');
        li.className = 'note-item' + (note.completed ? ' completed' : '');

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = note.completed;
        chk.addEventListener('change', () => {
          note.completed = chk.checked;
          save();
        });

        const span = document.createElement('span');
        span.className = 'note-text';
        span.textContent = note.text;
        span.addEventListener('click', () => {
          note.completed = !note.completed;
          save();
        });

        const del = document.createElement('button');
        del.className = 'del-btn';
        del.innerHTML = '&times;';
        del.title = 'Удалить';
        del.addEventListener('click', () => {
          notes = notes.filter(item => item.id !== note.id);
          save();
        });

        li.appendChild(chk);
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    addBtn.addEventListener('click', () => {
      const txt = input.value.trim();
      if (!txt) return;
      notes.unshift({ id: Date.now(), text: txt, completed: false });
      input.value = '';
      save();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addBtn.click();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
